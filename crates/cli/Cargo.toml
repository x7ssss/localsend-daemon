[package]
name = "localsend-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Command-line interface (lsend) and IPC client for LocalSend"

[[bin]]
name = "lsend"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
localsend-protocol = { path = "../protocol" }
localsend-discovery = { path = "../discovery" }
localsend-daemon = { path = "../daemon" }
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures-util = { version = "0.3", features = ["sink"] }
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
indicatif = "0.17"
console = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
subtle = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tempfile = "3.17"
rcgen = { version = "0.14", features = ["pem", "crypto", "ring"] }

[[test]]
name = "e2e_transfer"
path = "../../tests/e2e_transfer.rs"
