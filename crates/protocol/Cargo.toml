[package]
name = "localsend-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Core protocol wire formats, cryptographic primitives, and path sanitization for LocalSend v2"

[dependencies]
hex = "0.4.3"
rcgen = { version = "0.14.10", features = ["pem", "crypto", "ring"] }
rsa = "0.9.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }

[dev-dependencies]
