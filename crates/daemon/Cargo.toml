[package]
name = "localsend-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Headless LocalSend daemon (localsendd) featuring HTTPS receiver, session coordination, and IPC"

[[bin]]
name = "localsendd"
path = "src/main.rs"

[dependencies]
localsend-protocol = { path = "../protocol" }
localsend-discovery = { path = "../discovery" }
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
axum = { version = "0.8", default-features = false, features = ["tokio", "json", "query"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
subtle = "2.6"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
serde_yaml = "0.9.34"
ipnet = { version = "2.12.2", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "signal"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }

[package.metadata.deb]
name = "localsend-daemon"
maintainer = "localsend-daemon contributors <https://github.com/x7ssss/localsend-daemon>"
copyright = "2026 localsend-daemon contributors"
extended-description = """Headless LocalSend transfer daemon (localsendd) providing HTTPS receiver, dynamic session coordination, and local Unix Domain Socket control plane."""
section = "net"
priority = "optional"
assets = [
    ["target/release/localsendd", "usr/bin/localsendd", "755"],
    ["packaging/systemd/localsendd.service", "lib/systemd/system/localsendd.service", "644"],
]
